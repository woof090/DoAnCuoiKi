<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width" />
    <title>@ViewBag.Title</title>  
</head>
<body>
    <!-- HEADER + MENU -->
    <header class="header">
        <div class="container">
            <a href="#" class="logo">
                <img src="~/Images/Logo_02.png" alt="Logo" />
            </a>
            <nav class="menu">
                <a href="#" class="mn-fm">Trang chủ</a>
                <a href="#" class="mn-fm">Giới thiệu</a>
                <a href="#" class="mn-fm">Kỹ năng</a>
                <a href="#" class="mn-fm">Dự án</a>
                <a href="#" class="mn-fm">Kinh nghiệm</a>
                <a href="#" class="mn-fm">Học vấn</a>
                <a href="#" class="mn-fm">Chứng chỉ</a>
                <a href="#" class="mn-fm">Blog</a>
                <a href="#" class="mn-fm">Liên hệ</a>
            </nav>
            <div class="header-actions">
                <a href="/Account/Login" class="btn-login">
                    Đăng nhập
                </a>
            </div>
        </div>
    </header>
     <!-- SLIDESHOW 3 HÌNH -->
    <section class="slideshow-section">
        <div class="slideshow-container">
            <div class="mySlides fade">
                <div class="numbertext">1 / 3</div>
                <img src="@Url.Content("~/Images/Slide_01.jpg")"
                     alt="Hình ảnh giới thiệu 1" />
                <div class="text">Chào mừng đến với Website của tôi</div>
            </div>
            <div class="mySlides fade">
                <div class="numbertext">2 / 3</div>
                <img src="@Url.Content("~/Images/Slide_02.jpg")"
                     alt="Hình ảnh giới thiệu 2" />
                <div class="text">Kỹ năng và kinh nghiệm</div>
            </div>
            <div class="mySlides fade">
                <div class="numbertext">3 / 3</div>
                <img src="@Url.Content("~/Images/Slide_03.jpg")"
                     alt="Hình ảnh giới thiệu 3" />
                <div class="text">Khám phá các dự án của tôi</div>
            </div>
            <a class="prev"
               href="javascript:void(0)"
               onclick="plusSlides(-1)"
               aria-label="Ảnh trước">&#10094;</a>
            <a class="next"
               href="javascript:void(0)"
               onclick="plusSlides(1)"
               aria-label="Ảnh tiếp theo">&#10095;</a>
        </div>
        <div class="dots">
            <span class="dot"
                  onclick="currentSlide(1)"
                  aria-label="Ảnh 1"></span>
            <span class="dot"
                  onclick="currentSlide(2)"
                  aria-label="Ảnh 2"></span>
            <span class="dot"
                  onclick="currentSlide(3)"
                  aria-label="Ảnh 3"></span>
        </div>
    </section>
    <!-- MAIN CONTENT -->
    <main class="main">
        @RenderBody()
    </main>
    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="footer-logo"></div>
            <div class="footer-social"></div>
            <div class="footer-links"></div>
            <div class="footer-copyright"></div>
        </div>
    </footer>
</body>
</html>
